name: Build Keuangan

# Pola SAMA PERSIS Data Master (D:\Data Master\.github\workflows\build.yml,
# sudah terbukti jalan di lapangan) - compile TIDAK jalan tiap commit/push
# biasa, baru jalan otomatis kalau push GIT TAG berawalan "v" (mis. v1.0.0).
# workflow_dispatch tetap ada utk build uji manual tanpa bikin Release/tag.
#
# BEDA dari Data Master: Keuangan.Web serve React SPA dari wwwroot/ (lihat
# Program.cs UseStaticFiles()) - wwwroot SENGAJA di-gitignore (build output,
# bukan source), jadi WAJIB npm ci + npm run build DULU sebelum dotnet publish
# Keuangan.Web, supaya wwwroot terisi sebelum ikut ke-publish.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Tentukan nomor versi dari tag git
        id: version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $v = $env:GITHUB_REF -replace 'refs/tags/v', ''
          } else {
            $v = "0.0.0-dev"
          }
          echo "version=$v" >> $env:GITHUB_OUTPUT

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      # Versi HARUS cocok dgn yang dipakai generate package-lock.json lokal
      # (Node 24 / npm 11) - BUG NYATA ditemukan lewat run CI sungguhan:
      # `npm ci` di Node 22 menolak lockfile ini ("Missing: @emnapi/runtime
      # from lock file") krn resolusi optional dependency platform-native
      # (rolldown-vite) beda antar versi npm, walau package.json sama persis.
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Build frontend React (Keuangan.Web/frontend -> wwwroot)
        working-directory: src/Keuangan.Web/frontend
        run: |
          npm ci
          npm run build

      - name: Restore
        run: dotnet restore Keuangan.slnx

      - name: Publish Launcher (self-contained win-x64)
        run: dotnet publish src/Keuangan.Launcher/Keuangan.Launcher.csproj -c Release -r win-x64 --self-contained true -p:PublishReadyToRun=false -p:Version=${{ steps.version.outputs.version }} -o publish/Keuangan

      # LANGSUNG ke subfolder "web/" di dalam hasil publish Launcher - inilah
      # struktur folder yang dicari ServerProcessManager.LocateServerExecutable()
      # di PC pengguna (baseDir/web/Keuangan.Web.exe). JANGAN ubah lokasi ini
      # tanpa ikut mengubah ServerProcessManager.cs. wwwroot (hasil npm build
      # di atas) otomatis ikut ter-publish krn Keuangan.Web.csproj menganggapnya
      # content folder biasa.
      - name: Publish Keuangan.Web (self-contained win-x64) ke subfolder web/
        run: dotnet publish src/Keuangan.Web/Keuangan.Web.csproj -c Release -r win-x64 --self-contained true -p:PublishReadyToRun=false -p:Version=${{ steps.version.outputs.version }} -o publish/Keuangan/web

      - name: Upload artifact (folder mentah, dipakai debug manual)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v6
        with:
          name: Keuangan-win-x64
          path: publish/Keuangan
          retention-days: 3

      # Nama zip HARUS SAMA PERSIS dgn AssetName di UpdateChecker.cs
      # ("Keuangan-win-x64.zip") - itu yang dicari lewat GitHub API saat
      # aplikasi cek pembaruan.
      - name: Bikin zip hasil publish (diunduh app via GitHub API - UpdateChecker.cs)
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path "publish\Keuangan\*" -DestinationPath "dist\Keuangan-win-x64.zip" -Force

      - name: Upload zip (utk dipublish job release)
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v6
        with:
          name: Keuangan-Zip
          path: dist/*.zip
          retention-days: 1

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: Keuangan-Zip
          path: dist

      - name: Terbitkan GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: "Keuangan ${{ github.ref_name }}"
          generate_release_notes: true
          files: dist/*.zip

  # Simpan 2 RUN workflow terbaru + 2 RELEASE terbaru saja, sisanya dihapus -
  # permintaan eksplisit user ("hanya simpen 2 versi terbaru di git actions"),
  # pola sama persis cleanup job Data Master (sudah terbukti aman: hapus
  # Release+tag lama TIDAK mengganggu apa pun krn UpdateChecker.cs SELALU
  # menarik release "latest" lewat API, tidak pernah merujuk versi yang
  # sengaja dihapus).
  cleanup:
    needs: [build, release]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
    steps:
      - name: Bersihkan run build lama (simpan 2 terbaru)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/actions/workflows/build.yml/runs?per_page=100" \
            --jq '.workflow_runs[] | select(.status == "completed") | "\(.created_at) \(.id)"' \
            | sort -r | tail -n +2 | awk '{print $2}' \
            | while read -r id; do
                echo "hapus run lama id=$id"
                gh api -X DELETE "repos/${{ github.repository }}/actions/runs/$id" || true
              done

      - name: Bersihkan Release lama (simpan 2 terbaru)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --repo "${{ github.repository }}" --limit 100 \
            --json tagName,createdAt \
            --jq 'sort_by(.createdAt) | reverse | .[2:] | .[].tagName' \
            | while read -r tag; do
                echo "hapus release+tag lama: $tag"
                gh release delete "$tag" --repo "${{ github.repository }}" --cleanup-tag --yes || true
              done
